services:
  postgres:
    image: postgres:17
    container_name: dataprobe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dataprobe
      POSTGRES_PASSWORD: dataprobe
      POSTGRES_DB: chinook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
